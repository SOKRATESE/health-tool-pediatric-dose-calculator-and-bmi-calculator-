<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Emmanuel BMI and pediatric dose calculator</title>
  <style>
    :root { 
      color-scheme: dark; 
      font-family: Arial, sans-serif; 
      --bg:#0f1419;
      --card:#1a1f2e;
      --line:#2a3142;
      --accent:#00d4ff;
      --accent-dark:#0099cc;
      --warn:#fbbf24;
      --text-primary:#e8eef5;
      --text-secondary:#a8b3c1;
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(135deg,#0f1419 0%,#1a2332 45%,#131820 100%); color:var(--text-primary); }
    .page { max-width:1100px; margin:0 auto; padding:24px; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:24px; }
    .header-text h1 { margin:0; font-size:clamp(2rem, 5vw, 2.8rem); color:var(--accent); }
    p { color:var(--text-secondary); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px; }
    .card { background:rgba(26,31,46,0.8); border:1px solid var(--line); border-radius:20px; padding:18px; box-shadow:0 12px 24px rgba(0,0,0,.4); }
    .card h2 { margin-top:0; font-size:1.15rem; color:var(--accent); }
    label { display:block; font-size:.95rem; color:var(--text-secondary); margin-bottom:6px; }
    input, button { width:100%; border-radius:12px; border:1px solid var(--line); background:#0f1419; color:var(--text-primary); padding:12px 14px; font-size:1rem; }
    input::placeholder { color:rgba(168,179,193,0.5); }
    input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 8px rgba(0,212,255,0.2); }
    button { cursor:pointer; background:linear-gradient(135deg,var(--accent-dark),var(--accent)); color:#000; border:0; font-weight:700; transition:transform .08s ease, opacity .2s ease, box-shado[...] }
    button:hover { transform:translateY(-1px); box-shadow:0 8px 16px rgba(0,212,255,0.3); }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .muted { color:var(--text-secondary); font-size:.95rem; }
    .result-box { margin-top:12px; padding:12px; border-radius:14px; background:rgba(15,20,25,0.8); border:1px solid var(--line); min-height:52px; color:var(--text-secondary); }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:rgba(0,212,255,0.1); color:var(--accent); font-size:.9rem; margin-top:6px; }
    .badge { display:inline-block; font-weight:700; color:#000; background:var(--accent); padding:6px 10px; border-radius:999px; font-size:.9rem; }
    .warning { color:var(--warn); }
    .success { color:var(--accent); }
    .drug-input-wrapper { position:relative; }
    .drug-suggestions { 
      position:absolute; 
      top:100%; 
      left:0; 
      right:0; 
      background:rgba(15,20,25,0.98); 
      border:1px solid var(--accent); 
      border-top:none; 
      border-radius:0 0 12px 12px; 
      max-height:200px; 
      overflow-y:auto; 
      z-index:100; 
      display:none;
      box-shadow:0 12px 24px rgba(0,212,255,0.15);
    }
    .drug-suggestions.active { display:block; }
    .suggestion-item { 
      padding:10px 14px; 
      cursor:pointer; 
      border-bottom:1px solid var(--line); 
      transition:background-color .1s ease, color .1s ease;
      color:var(--text-secondary);
    }
    .suggestion-item:last-child { border-bottom:none; }
    .suggestion-item:hover { background:rgba(0,212,255,0.15); color:var(--accent); }
    .suggestion-item.selected { background:rgba(0,212,255,0.25); color:var(--accent); }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="header-text">
        <h1>BMI Calculator     pediatric dose calculator</h1>
      </div>
      <span class="badge">Live on localhost:8000</span>
    </header>

    <section class="grid">
      <article class="card">
        <h2>BMI Calculator</h2>
        <p class="muted">Enter body weight and height to see your BMI category instantly.</p>
        <div class="row">
          <div>
            <label for="weight">Weight (kg)</label>
            <input id="weight" type="number" step="0.1" placeholder="e.g. 68" />
          </div>
          <div>
            <label for="height">Height (m)</label>
            <input id="height" type="number" step="0.01" placeholder="e.g. 1.75" />
          </div>
        </div>
        <button id="calcBmiBtn" type="button">Calculate BMI</button>
        <div class="result-box" id="bmiResult">Your BMI result will appear here.</div>
      </article>

      <article class="card">
        <h2>Pediatric Drug Dose</h2>
        <p class="muted">input drug name and patient weight to calculate dose.</p>
        <div class="drug-input-wrapper">
          <label for="drugName">Drug name</label>
          <input id="drugName" type="text" placeholder="Start typing to find drugs..." autocomplete="off" />
          <div class="drug-suggestions" id="drugSuggestions"></div>
        </div>
        <div class="row" style="margin-top:12px;">
          <div>
            <label for="patientWeight">Weight (kg)</label>
            <input id="patientWeight" type="number" step="0.1" placeholder="e.g. 12.5" />
          </div>
          <div>
            <label for="patientName">Patient name</label>
            <input id="patientName" type="text" placeholder="Optional" />
          </div>
        </div>
        <button id="calcDoseBtn" type="button">Calculate Dose</button>
        <div class="result-box" id="doseResult">Dose details will appear here.</div>
      </article>
    </section>
  </main>

  <script>
    // Global variable to store drug data
    let drugDatabase = [];

    /**
     * Determines BMI category based on value
     * @param {number} value - BMI value
     * @returns {string} Category name
     */
  function bmiCategory(value) {
  if (value < 18.5)  return 'Underweight';
  if (value < 25)    return 'Normal weight';
  if (value < 30)    return 'Overweight';
  if (value < 35)    return 'Obese class 1';
  if (value < 40)    return 'Obese class 2';
  return 'Obese class 3';  
}

    /**
     * Parses CSV text into a 2D array
     * Handles quoted fields and CRLF line endings
     * @param {string} text - Raw CSV text
     * @returns {Array<Array<string>>} Parsed rows
     */
    function parseCsv(text) {
      const rows = [];
      let current = '';
      let row = [];
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          // Handle escaped quotes
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current);
          current = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          // Handle CRLF and LF line endings
          if (char === '\r' && next === '\n') {
            i++;
          }
          if (current.length > 0 || row.length > 0) {
            row.push(current);
            rows.push(row);
            row = [];
            current = '';
          }
        } else {
          current += char;
        }
      }

      // Push remaining content
      if (current.length > 0 || row.length > 0) {
        row.push(current);
        rows.push(row);
      }

      return rows;
    }

    /**
     * Converts a CSV row array to an object using headers
     * @param {Array<string>} row - CSV row data
     * @param {Array<string>} headers - Column headers
     * @returns {Object} Row as key-value object
     */
    function toObject(row, headers) {
      return Object.fromEntries(
        headers.map((key, index) => [key.trim(), (row[index] ?? '').trim()])
      );
    }

    /**
     * Calculates Levenshtein distance between two strings
     * Used for fuzzy matching of drug names
     * @param {string} a - First string
     * @param {string} b - Second string
     * @returns {number} Edit distance
     */
    function levenshtein(a, b) {
      const matrix = [];

      for (let i = 0; i <= b.length; i++) {
        matrix[i] = [i];
      }
      for (let j = 0; j <= a.length; j++) {
        matrix[0][j] = j;
      }

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }

      return matrix[b.length][a.length];
    }

    /**
     * Safely converts CSV value to number, handling empty strings
     * @param {string} value - CSV field value
     * @returns {number|null} Parsed number or null if empty/invalid
     */
    function parseNumericField(value) {
      if (!value || value.trim() === '') return null;
      const parsed = parseFloat(value);
      return Number.isFinite(parsed) ? parsed : null;
    }

    /**
     * Escapes HTML special characters to prevent injection
     * @param {string} text - Text to escape
     * @returns {string} Escaped text
     */
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    /**
     * Loads drug data from CSV file
     * Called on page load to populate the drug database
     */
    async function loadDrugDatabase() {
      try {
        const response = await fetch(`./drugs_example.csv?t=${Date.now()}`);
        if (!response.ok) {
          console.warn(`Failed to load drugs CSV: HTTP ${response.status}`);
          return;
        }

        const text = await response.text();
        const rows = parseCsv(text);

        if (rows.length < 2) {
          console.warn('No drug data available.');
          return;
        }

        const headers = rows[0];
        drugDatabase = rows.slice(1).map(row => toObject(row, headers));
      } catch (error) {
        console.warn('Error loading drug database:', error.message);
      }
    }

    /**
     * Updates drug name suggestions based on input
     * Filters drugs by similarity to input text
     */
    function updateDrugSuggestions() {
      const input = document.getElementById('drugName').value.trim().toLowerCase();
      const suggestionsBox = document.getElementById('drugSuggestions');

      if (input.length === 0) {
        suggestionsBox.classList.remove('active');
        return;
      }

      // Score drugs based on how well they match the input
      const scored = drugDatabase
        .map(drug => ({
          name: drug.Drug,
          distance: levenshtein(input, drug.Drug.toLowerCase())
        }))
        .filter(item => item.distance <= 5) // Only show reasonable matches
        .sort((a, b) => a.distance - b.distance)
        .slice(0, 8); // Show top 8 suggestions

      if (scored.length === 0) {
        suggestionsBox.classList.remove('active');
        return;
      }

      // Build HTML for suggestions
      suggestionsBox.innerHTML = scored
        .map((item, index) => `
          <div class="suggestion-item" data-drug-name="${escapeHtml(item.name)}">
            ${escapeHtml(item.name)}
          </div>
        `)
        .join('');

      // Add click handlers to suggestions
      suggestionsBox.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('click', () => {
          document.getElementById('drugName').value = item.dataset.drugName;
          suggestionsBox.classList.remove('active');
        });
      });

      suggestionsBox.classList.add('active');
    }

    // BMI Calculator Event Listener
    document.getElementById('calcBmiBtn').addEventListener('click', () => {
      const weight = parseFloat(document.getElementById('weight').value);
      const height = parseFloat(document.getElementById('height').value);
      const resultBox = document.getElementById('bmiResult');

      if (!Number.isFinite(weight) || !Number.isFinite(height) || height <= 0) {
        resultBox.innerHTML = '<span class="warning">⚠️ Please enter valid weight and height values.</span>';
        return;
      }

      const bmi = weight / (height * height);
      const category = bmiCategory(bmi);
      resultBox.innerHTML = `<span class="success">✓</span> BMI: <strong>${bmi.toFixed(2)}</strong> — <strong>${category}</strong>`;
    });

    // Drug name input with predictive suggestions
    document.getElementById('drugName').addEventListener('input', updateDrugSuggestions);

    // Close suggestions when clicking outside
    document.addEventListener('click', (event) => {
      const drugInput = document.getElementById('drugName');
      const suggestionsBox = document.getElementById('drugSuggestions');
      
      if (!event.target.closest('.drug-input-wrapper')) {
        suggestionsBox.classList.remove('active');
      }
    });

    // Pediatric Drug Dose Calculator Event Listener
    document.getElementById('calcDoseBtn').addEventListener('click', async () => {
      const btn = document.getElementById('calcDoseBtn');
      const drug = document.getElementById('drugName').value.trim();
      const weight = parseFloat(document.getElementById('patientWeight').value.trim());
      const patientName = document.getElementById('patientName').value.trim();
      const resultBox = document.getElementById('doseResult');

      // Validation
      if (!drug || !Number.isFinite(weight) || weight <= 0) {
        resultBox.innerHTML = '<span class="warning">⚠️ Please enter a drug name and a valid patient weight (> 0).</span>';
        return;
      }

      // Show loading state
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Calculating...';

      try {
        // Use cached drug database if available, otherwise fetch
        let drugs = drugDatabase;
        if (drugs.length === 0) {
          const response = await fetch(`./drugs_example.csv?t=${Date.now()}`);
          if (!response.ok) {
            throw new Error(`CSV file not found (HTTP ${response.status})`);
          }

          const text = await response.text();
          const rows = parseCsv(text);

          if (rows.length < 2) {
            throw new Error('No drug data available.');
          }

          const headers = rows[0];
          drugs = rows.slice(1).map(row => toObject(row, headers));
        }

        // Fuzzy matching: find closest drug name match
        const scored = drugs
          .map((obj) => {
            const distance = levenshtein(drug.toLowerCase(), obj.Drug.toLowerCase());
            return { obj, distance };
          })
          .sort((a, b) => a.distance - b.distance);

        const bestMatch = scored[0];
        const FUZZY_THRESHOLD = 3;

        if (!bestMatch || bestMatch.distance > FUZZY_THRESHOLD) {
          resultBox.innerHTML = '<span class="warning">⚠️ No close match found. Please check spelling. Available drugs may be listed in the CSV file.</span>';
          return;
        }

        const chosen = bestMatch.obj;

        // Build warning prefix for close-but-not-perfect matches
        let prefix = '';
        if (bestMatch.distance > 1) {
          prefix = `<span class="warning">Did you mean: <strong>${escapeHtml(chosen.Drug)}</strong>?</span><br><br>`;
        }

        // Parse numeric fields safely
        const mgPerKg = parseNumericField(chosen.mg_per_kg);
        const minPerKg = parseNumericField(chosen.min_mg_per_kg);
        const maxPerKg = parseNumericField(chosen.max_mg_per_kg);
        const concentration = parseNumericField(chosen.concentration_mg_per_ml);

        // Build output lines
        const lines = [];
        
        if (patientName) {
          lines.push(`Patient: <strong>${escapeHtml(patientName)}</strong>`);
        }
        
        lines.push(`Drug: <strong>${escapeHtml(chosen.Drug)}</strong>`);
        
        if (mgPerKg !== null) {
          lines.push(`Dose: <strong>${(mgPerKg * weight).toFixed(2)} mg</strong>`);
        }
        
        if (minPerKg !== null && maxPerKg !== null) {
          lines.push(`Range: <strong>${(minPerKg * weight).toFixed(2)} – ${(maxPerKg * weight).toFixed(2)} mg</strong>`);
        }
        
        if (concentration !== null && mgPerKg !== null) {
          lines.push(`Volume: <strong>${((mgPerKg * weight) / concentration).toFixed(2)} mL</strong>`);
        }
        
        if (chosen.frequency) {
          lines.push(`Frequency: ${escapeHtml(chosen.frequency)}`);
        }
        
        if (chosen.notes) {
          lines.push(`Notes: ${escapeHtml(chosen.notes)}`);
        }

        resultBox.innerHTML = prefix + '<span class="success">✓</span> ' + lines.join('<br />');

      } catch (error) {
        resultBox.innerHTML = `<span class="warning">⚠️ Request failed: ${escapeHtml(error.message)}</span>`;
      } finally {
        // Restore button state
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });

    // Load drug database on page load
    loadDrugDatabase();
  </script>
</body>
</html>
